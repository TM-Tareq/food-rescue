server:
  port: 8080
  servlet:
    context-path: /api/v1

spring:
  application:
    name: food-rescue-backend

  datasource:
    url: jdbc:mysql://localhost:3306/food_rescue_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: ""
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql

jwt:
  secret: 9a6e8b1c2d3e4f5a6b7c8d9e0f1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a
  expiration-ms: 86400000 # 24 hours
