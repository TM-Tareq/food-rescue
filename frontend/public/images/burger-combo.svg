<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#991b1b"/>
      <stop offset="100%" stop-color="#450a0a"/>
    </linearGradient>
    <filter id="shadow5" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="600" height="400" fill="url(#bgGrad5)"/>
  
  <!-- Burger Stack -->
  <g transform="translate(250, 100)">
    <!-- Top Bun -->
    <path d="M 0,90 A 70,50 0 0,1 140,90 Z" fill="#d97706" stroke="#b45309" stroke-width="4" filter="url(#shadow5)"/>
    <!-- Sesame Seeds -->
    <circle cx="40" cy="65" r="3" fill="#fef08a"/>
    <circle cx="70" cy="55" r="3" fill="#fef08a"/>
    <circle cx="100" cy="65" r="3" fill="#fef08a"/>
    <!-- Cheese Layer -->
    <polygon points="-10,95 150,95 140,110 0,110" fill="#fbbf24"/>
    <!-- Beef Patty -->
    <rect x="-5" y="110" width="150" height="25" rx="8" fill="#451a03"/>
    <!-- Lettuce -->
    <path d="M -15,135 Q 20,150 70,135 Q 120,150 155,135 Z" fill="#22c55e"/>
    <!-- Bottom Bun -->
    <rect x="0" y="145" width="140" height="25" rx="6" fill="#d97706"/>
  </g>

  <!-- French Fries Box -->
  <g transform="translate(420, 180)">
    <path d="M 0,50 L 20,140 L 80,140 L 100,50 Z" fill="#dc2626" filter="url(#shadow5)"/>
    <!-- Fries Stems -->
    <rect x="15" y="-10" width="12" height="70" rx="3" fill="#fbbf24"/>
    <rect x="32" y="-20" width="12" height="80" rx="3" fill="#fbbf24"/>
    <rect x="50" y="-15" width="12" height="75" rx="3" fill="#fbbf24"/>
    <rect x="68" y="-5" width="12" height="65" rx="3" fill="#fbbf24"/>
  </g>

  <!-- Overlay Text Badge -->
  <rect x="25" y="25" width="230" height="38" rx="19" fill="rgba(15, 23, 42, 0.85)"/>
  <text x="140" y="49" font-family="Arial, sans-serif" font-weight="bold" font-size="14" fill="#fbbf24" text-anchor="middle">🍔 BEEF BURGER & FRIES</text>
</svg>
