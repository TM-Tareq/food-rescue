<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="riceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="meatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="600" height="400" fill="url(#bgGrad)"/>
  
  <!-- Outer Brass Handi Plate -->
  <circle cx="300" cy="200" r="160" fill="#b45309" stroke="#f59e0b" stroke-width="8" filter="url(#shadow)"/>
  <circle cx="300" cy="200" r="145" fill="#d97706"/>
  
  <!-- Rice Mound -->
  <circle cx="300" cy="200" r="130" fill="url(#riceGrad)"/>
  
  <!-- Mutton Pieces -->
  <path d="M 230,170 Q 250,140 280,160 Q 300,180 260,200 Z" fill="url(#meatGrad)"/>
  <path d="M 310,180 Q 350,150 370,190 Q 340,220 310,180 Z" fill="url(#meatGrad)"/>
  <path d="M 250,220 Q 290,200 320,240 Q 270,260 250,220 Z" fill="url(#meatGrad)"/>

  <!-- Golden Potato Piece -->
  <circle cx="230" cy="210" r="22" fill="#fbbf24" stroke="#d97706" stroke-width="3"/>
  <circle cx="360" cy="220" r="20" fill="#fbbf24" stroke="#d97706" stroke-width="3"/>

  <!-- Saffron Rice Grains & Garnish -->
  <circle cx="280" cy="140" r="3" fill="#ea580c"/>
  <circle cx="330" cy="150" r="4" fill="#dc2626"/>
  <circle cx="340" cy="240" r="3" fill="#ea580c"/>
  <circle cx="210" cy="180" r="4" fill="#16a34a"/>
  <circle cx="380" cy="170" r="3" fill="#16a34a"/>

  <!-- Borhani Glass Side -->
  <g transform="translate(480, 260)">
    <rect x="-25" y="-60" width="50" height="90" rx="8" fill="#15803d" opacity="0.85" filter="url(#shadow)"/>
    <rect x="-22" y="-55" width="44" height="75" rx="6" fill="#22c55e" opacity="0.9"/>
    <circle cx="0" cy="-65" r="10" fill="#fef08a"/>
    <text x="0" y="45" font-family="Arial, sans-serif" font-weight="bold" font-size="12" fill="#ffffff" text-anchor="middle">BORHANI</text>
  </g>

  <!-- Overlay Text Badge -->
  <rect x="25" y="25" width="220" height="38" rx="19" fill="rgba(15, 23, 42, 0.85)"/>
  <text x="135" y="49" font-family="Arial, sans-serif" font-weight="bold" font-size="14" fill="#fbbf24" text-anchor="middle">🍲 ROYAL MUTTON KACCHI</text>
</svg>
